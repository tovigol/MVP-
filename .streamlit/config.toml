# Shared look of the web app (app.py): AgentGuard orange for buttons and toggles, light theme
# (the dashboard and onboarding cards are designed for a light background).
[theme]
base = "light"
primaryColor = "#f26b1d"
backgroundColor = "#f5f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#101828"

[client]
# Hide the developer "Deploy" toolbar from the owner's screen.
toolbarMode = "minimal"
