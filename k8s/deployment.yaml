apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-monitor-api
  labels:
    app: transaction-monitor-api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: transaction-monitor-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: transaction-monitor-api
    spec:
      containers:
        - name: api
          image: transaction-monitor-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: transaction-monitor-secrets
                  key: redis-connection-string
            - name: Cors__AllowedOrigins__0
              value: "https://monitor.example.com"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Secret
metadata:
  name: transaction-monitor-secrets
type: Opaque
stringData:
  # Replace with the real managed Redis endpoint before deploying.
  redis-connection-string: "redis-service:6379"
